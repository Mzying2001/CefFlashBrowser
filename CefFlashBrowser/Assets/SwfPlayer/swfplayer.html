<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>FlashPlayer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        #flash-player {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100vh;
        }
    </style>
    <script>
        // 是否启用“屏幕滑动适配”（v1）：由主程序导航本页时带 ?slide=1 决定
        var slideAdapt = new URLSearchParams(location.search).get('slide') === '1';

        // 禁用浏览器把这区域内的触摸拖动当作滚动/缩放，
        // 让单指拖动以鼠标事件形式递交给 Flash（SWF 里的滑块/拖拽才可动）
        function applySlideAdapt() {
            if (!slideAdapt) return;
            document.documentElement.style.touchAction = 'none';
            document.body.style.touchAction = 'none';
            document.body.style.overscrollBehavior = 'none';
            var flash = document.getElementById('flash-player');
            if (flash) flash.style.touchAction = 'none';
        }

        function getFileName(src) {
            src = src.replace(/\\/g, '/');
            return src.split('/').pop().split('?')[0];
        }
        function loadSwf(src) { // called by CefSharp
            let flash = document.createElement("embed");
            flash.id = "flash-player";
            flash.setAttribute("src", src);
            if (slideAdapt) flash.setAttribute("style", "touch-action: none;");
            document.body.replaceChild(flash, document.getElementById(flash.id));
            document.title = getFileName(src);
            applySlideAdapt();
        }

        applySlideAdapt();
    </script>
</head>

<body>
    <embed id="flash-player" src="" />
</body>

</html>
