<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>FlashPlayer</title>
    <style>
        #flash-player {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100vh;
        }
    </style>
    <script>
        function getFileName(src) {
            src = src.replace(/\\/g, '/');
            return src.split('/').pop().split('?')[0];
        }
        function loadSwf(src, baseUrl, attributes) { // called by CefSharp or initialized by the player page
            if (baseUrl) {
                const base = document.createElement("base");
                base.href = baseUrl;
                document.head.appendChild(base);
            }
            let flash = document.createElement("embed");
            flash.id = "flash-player";
            if (attributes) {
                flash.setAttribute("type", "application/x-shockwave-flash");
                flash.setAttribute("allowscriptaccess", "never");
                for (const [name, value] of Object.entries(attributes)) {
                    flash.setAttribute(name, value);
                }
            }
            flash.setAttribute("src", src);
            document.body.replaceChild(flash, document.getElementById(flash.id));
            document.title = getFileName(src);
        }
    </script>
</head>

<body>
    <embed id="flash-player" src="" />
    <!-- player initialization -->
</body>

</html>
